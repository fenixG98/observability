[package]
name = "observability"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local resource monitor for the terminal (Linux and macOS)"
publish = false

[dependencies]
ratatui = "0.30"
sysinfo = "0.40"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13"

[dev-dependencies]
insta = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
